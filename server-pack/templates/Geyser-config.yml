# Kairu crossplay baseline for plugins/Geyser-Spigot/config.yml.
# Copy only after Geyser has generated its own config, or compare against the version-generated file.
# Geyser may migrate this format; preserve unknown keys produced by your installed build.

bedrock:
  # Public UDP listener for Bedrock Edition. Do not use the Java TCP port here.
  address: 0.0.0.0
  port: 19132
  # Leave automatic unless a documented proxy/network design requires another mode.
  clone-remote-port: false

remote:
  # Same host as Geyser-Spigot. Keep server.properties server-ip blank and server-port=25565.
  address: 127.0.0.1
  port: 25565
  # Geyser resolves the correct Java auth mode from the backend configuration.
  auth-type: floodgate

# Floodgate will generate plugins/floodgate/key.pem. Geyser uses the public half of that key.
# Verify this exact key path against the config generated by the installed Geyser build.
floodgate-key-file: key.pem

# Recommended operational defaults.
command-suggestions: true
passthrough-motd: true
passthrough-player-counts: true
legacy-ping-passthrough: false
ping-passthrough-interval: 3
forward-player-ping: false
max-players: 50

# Keep global metrics policy intentional. This affects Geyser telemetry only.
metrics:
  enabled: true

# Do not change unless troubleshooting with GeyserMC support.
debug-mode: false
