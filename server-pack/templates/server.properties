# Kairu Paper/Purpur 1.21.4 baseline. Review values for your community before first production restart.
# Geyser listens separately on UDP 19132. Java remains TCP 25565.
server-port=25565
server-ip=
motd=Kairu SMP — Java & Bedrock Crossplay
max-players=50
online-mode=true
enforce-secure-profile=true
white-list=true
enforce-whitelist=true
spawn-protection=0
pvp=true
difficulty=normal
gamemode=survival
level-name=world
level-seed=
level-type=minecraft:normal
generate-structures=true
view-distance=10
simulation-distance=8
allow-flight=false
use-native-transport=true
enable-status=true
hide-online-players=false
enable-query=false
enable-rcon=false
rcon.password=
rcon.port=25575
broadcast-rcon-to-ops=false
broadcast-console-to-ops=true
op-permission-level=4
function-permission-level=2
player-idle-timeout=0
rate-limit=0
network-compression-threshold=256
max-tick-time=60000
sync-chunk-writes=true
region-file-compression=deflate
resource-pack=
resource-pack-sha1=
require-resource-pack=false
accept-transfers=false
log-ips=true
pause-when-empty-seconds=-1
# Do not set online-mode=false for Floodgate. Floodgate supports Bedrock players while Java authentication remains enabled.
