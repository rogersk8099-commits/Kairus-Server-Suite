name: Sync lint-clean Kairu suite source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-lint-clean-suite.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and replace source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/gsvpczmFlxkxdvIO.zip' -o /tmp/source.zip
          echo 'bd46627b2efc66302cfa770656430d7c8e25c29c87bfd8e103c5c87150ec278a  /tmp/source.zip' | sha256sum -c -
          temp=$(mktemp -d)
          unzip -q /tmp/source.zip -d "$temp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$temp"/. .
          rm -f .github/workflows/sync-lint-clean-suite.yml
          git config user.name 'Kairu Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Sync lint-clean final Kairu suite'
          git push
