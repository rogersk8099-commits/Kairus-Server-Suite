name: Sync final Kairu suite source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-final-suite.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and replace source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/FRdrxWZrKwOrpbkH.zip' -o /tmp/source.zip
          echo '70a76d9673aa5bab395dd521a137b1fdd727cd77a3ff0e759681d6ef3fc2ecd5  /tmp/source.zip' | sha256sum -c -
          temp=$(mktemp -d)
          unzip -q /tmp/source.zip -d "$temp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$temp"/. .
          rm -f .github/workflows/sync-final-suite.yml
          git config user.name 'Kairu Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Add Discord bot, OAuth, favicon, and SMPPlatform source'
          git push
