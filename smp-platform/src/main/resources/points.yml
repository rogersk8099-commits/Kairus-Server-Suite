config-version: 1
points:
  enabled: true
  precision: 0
  transaction-ledger: {required-for-every-change: true, immutable: true, idempotency-required: true}
  currencies:
    KAIRU_POINTS: {display-name: "Kairu Points", account-kinds: [PLAYER], worlds: [ashfall, quarry], allow-negative: false}
    NEXUS_POINTS: {display-name: "Nexus Points", account-kinds: [PLAYER], worlds: [ashfall, quarry], allow-negative: false}
    GUILD_POINTS: {display-name: "Guild Points", account-kinds: [GUILD], worlds: [ashfall, obsidian-gate, atrium, colosseum, quarry], allow-negative: false}
    HARDCORE_POINTS: {display-name: "Hardcore Points", account-kinds: [PLAYER], worlds: [obsidian-gate], allow-negative: false}
    BUILD_POINTS: {display-name: "Build Points", account-kinds: [PLAYER], worlds: [atrium], allow-negative: false}
    EVENT_POINTS: {display-name: "Event Points", account-kinds: [PLAYER, GUILD], worlds: [colosseum], allow-negative: false}
    SEASON_POINTS: {display-name: "Season Points", account-kinds: [PLAYER, GUILD], worlds: [ashfall, obsidian-gate, atrium, colosseum, quarry], allow-negative: false}
  sources: [GAMEPLAY, ADMIN, ACHIEVEMENT, EVENT, GUILD, QUEST, SKRIPT, API, SYSTEM, REFUND, ADJUSTMENT]
  automatic-rewards:
    # Disabled by default. When enabled, the durable reward key prevents repeat payouts across restarts.
    first-link: {enabled: true, currency: KAIRU_POINTS, amount: 100, reason: "First verified account link", scope: PLATFORM_USER, repeat: NEVER}
    first-join: {enabled: true, currency: KAIRU_POINTS, amount: 50, reason: "First Kairu SMP join", scope: PLATFORM_USER, repeat: NEVER}
    daily-playtime: {enabled: true, currency: KAIRU_POINTS, required-minutes: 60, amount: 25, scope: PLATFORM_USER, cooldown: DAILY, daily-cap: 25}
    weekly-playtime: {enabled: true, currency: KAIRU_POINTS, required-minutes: 420, amount: 100, scope: PLATFORM_USER, cooldown: WEEKLY, weekly-cap: 100}
    event-participation: {enabled: true, currency: EVENT_POINTS, amount: 25, scope: PLATFORM_USER, per-event-cap: 1}
    event-win: {enabled: true, currency: EVENT_POINTS, amount: 100, scope: PLATFORM_USER, per-event-cap: 1}
    # One durable reward per featured submission. Set enabled: false to feature without a payout.
    featured-build: {enabled: true, currency: BUILD_POINTS, amount: 250, reason: "Atrium build featured", scope: MINECRAFT_ACCOUNT}
  leaderboard: {page-size: 10, refresh-seconds: 60}
  history: {player-page-size: 20, staff-page-size: 50}
  staff-actions: {require-reason-for: [set, remove], require-confirmation-for: [set]}

  earning-policy:
    spawn-hub: {enabled: false}
    verdance: {enabled: false}
    quarry: {raw-mining-rewards: false}
    platform-reward-deduplication: true
    reconnect-rewards: false
