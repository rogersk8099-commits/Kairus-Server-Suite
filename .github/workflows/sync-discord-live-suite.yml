name: Sync active Discord suite

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-discord-live-suite.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and install source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/tfyycobRhBcXJUIY.zip' -o /tmp/source.zip
          echo '96853bac214cc2ad7b43b35f7e5aee874e3b92f725f97edd7e8cbc32fd74e2a5  /tmp/source.zip' | sha256sum -c -
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -f .github/workflows/sync-discord-live-suite.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record active Discord server, OAuth, bot and invite'
          git push
