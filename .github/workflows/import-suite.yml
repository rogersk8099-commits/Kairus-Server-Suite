name: Import complete Kairu suite

on:
  push:
    paths:
      - .github/workflows/import-suite.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified suite
        shell: bash
        run: |
          curl -fsSL https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/aozswEXKDFvsDwKI.zip -o /tmp/kairu-suite.zip
          printf '%s  %s\n' 'e053b3b6280f7e9ae62b053772f842647cd68f955e1e9f8d687e842bf1a84a52' '/tmp/kairu-suite.zip' | sha256sum -c -
          mkdir -p /tmp/kairu-suite
          unzip -q /tmp/kairu-suite.zip -d /tmp/kairu-suite
          rsync -a --exclude '.github/' /tmp/kairu-suite/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete Kairu SMP suite'
          git push
