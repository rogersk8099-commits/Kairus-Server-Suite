# Kairu Floodgate baseline for plugins/floodgate/config.yml.
# This matches the upstream Floodgate structure. Compare with the config generated by your installed release.

# Floodgate generates this private key file in its own configuration directory.
# Geyser must reference the corresponding public key as documented by its generated config.
key-file-name: key.pem

# Preserve a non-alphanumeric Bedrock prefix to prevent Java/Bedrock name collisions.
username-prefix: "."
replace-spaces: true
# default-locale: en_US

disconnect:
  invalid-key: Please connect through the official Kairu Geyser endpoint.
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

player-link:
  enabled: true
  require-link: false
  # KairuBridge identity linking is separate from Floodgate account linking. Keep false unless a supported
  # Floodgate linking database implementation has been deliberately installed and tested.
  enable-own-linking: false
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: true

metrics:
  enabled: true

# Do not change this format number unless Floodgate itself migrates the file.
config-version: 3
